services:
  app:
    image: myorg/app
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE
    security_opt:
      - seccomp:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc
      - ./data:/data
    environment:
      DB_PASSWORD: supersecret123
      API_TOKEN: ${API_TOKEN}
      GITHUB_TOKEN: ghp_abcdefghijklmnopqrstuvwxyz0123456789AB
  db:
    image: postgres:16
    ports:
      - "5432:5432"
      - "127.0.0.1:6379:6379"
    environment:
      - POSTGRES_PASSWORD=changeme
